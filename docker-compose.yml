name: workless

services:
  app:
    build:
      context: .
      dockerfile: .docker/node/Dockerfile
      target: development
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME:-Workless}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-zairosoft}
      DB_SYNC: ${DB_SYNC:-false}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    volumes:
      - ./:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    expose:
      - "3000"
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-zairosoft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./.docker/db/sql:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-zairosoft}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # WARNING: Remove these port mappings in production. Use internal Docker network only.
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # WARNING: Remove these port mappings in production. Use internal Docker network only.
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    networks:
      - backend

volumes:
  node_modules:
  postgres_data:
  redis_data:

networks:
  edge:
  backend:
